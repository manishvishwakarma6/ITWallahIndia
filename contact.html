<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" type="image/png" href="./images/logo.png">
    <title>Get In Touch - IT Wallah India</title>
    <!-- Font Awesome for Top Header -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="css/navbar.css" rel="stylesheet">
    <link href="css/cursor.css" rel="stylesheet">
    <link href="css/contact.css" rel="stylesheet">
    <link href="css/footer.css" rel="stylesheet">
    <link href="css/about.css" rel="stylesheet">

</head>

<body>

    <!-- start Cursor Dot with mouse arrow -->
    <div class="cursor-dot" id="cursorDot"></div>
    <!-- end Cursor Dot with mouse arrow-->

    <!-- STICKY WRAPPER: Fixed at the top with dynamic component placeholders -->
    <div class="sticky-top-wrapper">
        <div id="header-placeholder"></div>
        <div id="navbar-placeholder"></div>
    </div>
    <!-- STICKY WRAPPER END -->

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1>Contact IT Wallah</h1>
            <p>Empowering the next generation of software engineers through quality education.</p>
        </div>
    </section>

    <section class="contact-section">

        <div class="container">

            <div class="row">

                <!-- LEFT CONTACT INFO -->

                <div class="col-lg-5">

                    <div class="timeline">

                        <div class="timeline-item">
                            <h6>ADDRESS</h6>
                            <p>
                                Anand Nagar, Bhopal, Madhya Pradesh, India 462022
                            </p>
                        </div>

                        <div class="timeline-item">
                            <h6>EMAIL</h6>
                            <p>itwallahindia@gmail.com</p>
                        </div>

                        <div class="timeline-item">
                            <h6>WEBSITE</h6>
                             <a href="https://itwallah.in" target="_blank">IT Wallah India</a>
                        </div>

                        <div class="timeline-item">
                            <h6>YouTube</h6>
                            <a href="https://www.youtube.com/@itwallahindia" target="_blank">IT Wallah India</a>
                        </div>

                    </div>
                    <ul class="social-icons-list">
                        <li><a href="https://www.linkedin.com/in/manishkumarvish" target="_blank"><i
                                    class="fab fa-linkedin-in"></i></a></li>
                        <li><a href="https://www.youtube.com/@itwallahindia" target="_blank"><i
                                    class="fab fa-youtube"></i></a></li>
                        <li><a href="https://www.instagram.com/itwallahindia/" target="_blank"><i
                                    class="fab fa-instagram"></i></a></li>
                        <li><a href="https://www.facebook.com/itwallahindia/" target="_blank"><i
                                    class="fab fa-facebook"></i></a></li>
                        <li><a href="https://twitter.com/itwallahindia" target="_blank"><i class="fab fa-twitter"></i></a>
                        </li>
                        <li><a href="http://t.me/itwallahindia" target="_blank"><i class="fa-brands fa-telegram"></i></a>
                        </li>

                    </ul>

                </div>

                <!-- RIGHT FORM -->

                <div class="col-lg-7">

                    <div class="contact-card">

                        <h3 class="mb-4 text-center">Get In Touch</h3>

                        <form id="contactForm">

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <input type="text" name="firstName" class="form-control" placeholder="First Name" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                   <input type="text" name="lastName" class="form-control" placeholder="Last Name" required>
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                     <input type="email" name="email" class="form-control" placeholder="Email" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                     <input type="text" name="mobile" class="form-control" placeholder="Mobile Number" required>
                                </div>

                            </div>

                            <div class="mb-3">
                                <textarea name="message" class="form-control" rows="4" placeholder="Message"></textarea>
                            </div>

                             <button type="submit" class="btn submit-btn">Submit</button>

                        </form>

                    </div>

                </div>

            </div>

            <!-- MAP -->

            <div class="row mt-5">

                <div class="col-lg-12">

                    <div class="map-card">

                        <iframe src="https://maps.google.com/maps?q=bhopal&t=&z=13&ie=UTF8&iwloc=&output=embed">
                        </iframe>

                    </div>

                </div>

            </div>

        </div>

    </section>
    
    <!-- DYNAMIC FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components-loader.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/script.js"></script>
    <script src="js/home-sections.js"></script>
    
    
    <!-- firebase -->
     <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/contact.js"></script>
    
    
     </body>

</html>
